[package]
name = "chuck-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
chuck-code = { version = "18.0.0-alpha.1", path = "../chuck-code" }
chuck-daemon = { version = "18.0.0-alpha.1", path = "../chuck-daemon" }
chuck-core = { version = "18.0.0-alpha.1", path = "../chuck-core" }
chuck-model = { version = "18.0.0-alpha.1", path = "../chuck-model" }
chuck-runtime = { version = "18.0.0-alpha.1", path = "../chuck-runtime" }
chuck-sandbox = { version = "18.0.0-alpha.1", path = "../chuck-sandbox" }
chuck-store = { version = "18.0.0-alpha.1", path = "../chuck-store" }
chuck-mcp = { version = "18.0.0-alpha.1", path = "../chuck-mcp" }
chuck-web = { version = "18.0.0-alpha.1", path = "../chuck-web" }
chuck-tools = { version = "18.0.0-alpha.1", path = "../chuck-tools" }
regex = "1.13.1"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
