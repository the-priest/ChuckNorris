<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Chuck Norris — Arch and CachyOS desktop agent">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8a6520"/>
      <stop offset="50%"  stop-color="#f0d089"/>
      <stop offset="100%" stop-color="#8a6520"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b6892f" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#fff3d0" stop-opacity=".95"/>
      <stop offset="55%"  stop-color="#fff3d0" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#b6892f" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="titleClip"><text x="450" y="92" text-anchor="middle"
      font-family="DejaVu Sans, Verdana, sans-serif" font-size="54" font-weight="bold"
      letter-spacing="7">CHUCK NORRIS</text></clipPath>
    <style>
      .sweep   { animation: sweep 4.5s ease-in-out infinite; }
      .blink   { animation: blink 1.05s steps(1) infinite; }
      .rise    { animation: rise 1s ease-out both; }
      .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}
      .pulse   { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes sweep { 0%{transform:translateX(-460px)} 55%,100%{transform:translateX(460px)} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes rise  { from{opacity:0;transform:translateY(9px)} to{opacity:1;transform:translateY(0)} }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
      @media (prefers-reduced-motion: reduce) {
        .sweep,.blink,.rise,.pulse { animation: none; }
        .sweep { opacity: 0; } .rise { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="900" height="200" rx="14" fill="#0b0b0d"/>
  <rect x="1.5" y="1.5" width="897" height="197" rx="13" fill="none" stroke="#2a2118" stroke-width="2"/>
  <g opacity=".5">
    <circle cx="26" cy="26" r="5" fill="#ff5f57"/>
    <circle cx="46" cy="26" r="5" fill="#febc2e"/>
    <circle cx="66" cy="26" r="5" fill="#28c840"/>
  </g>

  <text x="450" y="92" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"
        font-size="54" font-weight="bold" letter-spacing="7" fill="url(#gold)"
        class="rise">CHUCK NORRIS</text>
  <g clip-path="url(#titleClip)">
    <rect class="sweep" x="0" y="40" width="150" height="70" fill="url(#sheen)"/>
  </g>

  <text x="450" y="122" text-anchor="middle" font-family="DejaVu Sans Mono, monospace"
        font-size="15" fill="#7d7264" letter-spacing="2" class="rise d1">
    Arch / CachyOS desktop agent &#183; decides &amp; acts
  </text>

  <g font-family="DejaVu Sans Mono, monospace" font-size="14">
    <text x="60" y="164" fill="#4c8f4c" class="rise d2">$</text>
    <text x="80" y="164" fill="#c8bfae" class="rise d2">chucknorris</text>
    <rect x="196" y="152" width="9" height="16" fill="#b6892f" class="blink"/>
  </g>

  <g font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="end">
    <text x="840" y="150" fill="#4c8f4c" class="rise d3">&#9679; 15 suites green</text>
    <text x="840" y="170" fill="#6b6357" class="rise d4">&#9679; 0 orphans &#183; 1 sudo prompt</text>
  </g>
  <circle cx="856" cy="146" r="4" fill="#2ea043" class="pulse"/>
</svg>
